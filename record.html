```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>健康管理與運動記錄系統</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Chart DataLabels -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<style>

body{
    font-family:"Segoe UI",Arial,sans-serif;
    margin:20px;
    background:#f5f6fa;
    color:#333;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

#todayDate{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

h2{
    margin-top:25px;
}

.summary-box{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-bottom:20px;
    text-align:center;
    line-height:1.8;
    font-size:16px;
}

#recentTable{
    overflow-x:auto;
    margin-bottom:30px;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
    font-size:13px;
}

th{
    background:#f1f1f1;
}

.chart-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.chart-box{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.chart-box h3{
    text-align:center;
    margin-bottom:10px;
}

.avg-box{
    text-align:center;
    margin-top:10px;
    color:#666;
}

canvas{
    width:100% !important;
    aspect-ratio:4/3 !important;
}

.success{
    color:#1cc88a;
    font-weight:bold;
}

.fail{
    color:#e74a3b;
    font-weight:bold;
}

@media(max-width:600px){

    body{
        margin:10px;
    }

    th,td{
        font-size:11px;
    }
}

</style>

</head>

<body>

<h1>🏋️‍♀️ 健康管理與運動記錄系統 (Demo: Nancy)</h1>

<div id="todayDate"></div>

<h2>🎯 Target 每週至少運動3次 ＆ 24點前睡覺</h2>

<div class="summary-box" id="sleepSummary"></div>

<h2>🗓️ 最近 10 筆健康與運動紀錄</h2>

<div id="recentTable"></div>

<div class="chart-container">

    <div class="chart-box">
        <h3>🏃‍♂️ 每月有氧活動時間</h3>
        <canvas id="aerobicChart"></canvas>
        <div class="avg-box" id="avgAerobic"></div>
    </div>

    <div class="chart-box">
        <h3>📋 每月教練指定作業</h3>
        <canvas id="assignedChart"></canvas>
        <div class="avg-box" id="avgAssigned"></div>
    </div>

    <div class="chart-box">
        <h3>💪 每月肌力訓練</h3>
        <canvas id="strengthChart"></canvas>
        <div class="avg-box" id="avgStrength"></div>
    </div>

    <div class="chart-box">
        <h3>🛌 每月24點前睡覺次數</h3>
        <canvas id="sleepChart"></canvas>
        <div class="avg-box" id="avgSleep"></div>
    </div>

</div>

<script>

const today = new Date();

document.getElementById("todayDate").innerHTML =
`📅 今天日期：${today.toLocaleDateString("zh-TW")}`;

let allData = [];

let chartInstances = {};

function toNum(v){

    const n = Number(v);

    return isNaN(n) ? 0 : n;
}

fetch("sport.csv")

.then(res => res.text())

.then(text => {

    const lines = text.trim().split("\n");

    const headers = lines.shift().split(",");

    allData = lines.map(line => {

        const values = line.split(",");

        const row = {};

        headers.forEach((h,i)=>{

            row[h.trim()] = values[i]
                ? values[i].trim()
                : "";
        });

        let sleepRaw = row.sleep || "";

        let sleepHour = 99;

        if(sleepRaw.includes(":")){

            try{

                const parts = sleepRaw.split(":");

                let hr = Number(parts[0]);

                let mn = Number(parts[1] || 0);

                // 凌晨時間視為隔天
                if(hr < 6){
                    hr += 24;
                }

                sleepHour = hr + mn / 60;

            }catch(e){

                sleepHour = 99;
            }
        }

        const isSuccess =
            sleepHour < 24;

        return {

            date: row.date,

            running: toNum(row.running),

            weight: toNum(row.weight),

            ball: toNum(row.ball),

            assigned: toNum(row.assigned),

            trail: toNum(row.trail),

            yoga: toNum(row.yoga),

            other: toNum(row.other),

            speed: row.speed,

            heart_rate: row.heart_rate,

            sleep_raw: sleepRaw,

            sleep_hour: sleepHour,

            is_success: isSuccess,

            remark: row.remark || "日常紀錄"
        };

    }).filter(x => x.date);

    allData.sort((a,b)=>

        new Date(a.date.replace(/\//g,"-")) -
        new Date(b.date.replace(/\//g,"-"))
    );

    renderAll();

})

.catch(err => {

    console.error("CSV讀取失敗:", err);

});

function renderAll(){

    const sorted = [...allData].sort((a,b)=>

        new Date(b.date.replace(/\//g,"-")) -
        new Date(a.date.replace(/\//g,"-"))
    );

    renderRecentTable(sorted.slice(0,10));

    const monthly = {};

    allData.forEach(item => {

        const ym =
            item.date.replace(/\//g,"-").slice(0,7);

        if(!monthly[ym]){

            monthly[ym] = {

                aerobic:0,

                assigned:0,

                strength:0,

                success_count:0,

                total_days:0
            };
        }

        monthly[ym].aerobic +=
            item.running +
            item.ball +
            item.trail;

        monthly[ym].assigned +=
            item.assigned;

        monthly[ym].strength +=
            item.weight +
            item.yoga;

        monthly[ym].total_days += 1;

        if(item.is_success){

            monthly[ym].success_count += 1;
        }

    });

    const labels =
        Object.keys(monthly).sort();

    const sums =
        Object.values(monthly);

    renderCharts(labels,sums);

    renderAverages(sums);

    renderSleepSummary();
}

function renderRecentTable(data){

    const container =
        document.getElementById("recentTable");

    const table =
        document.createElement("table");

    table.innerHTML = `

    <thead>
        <tr>
            <th>日期</th>
            <th>跑步</th>
            <th>肌力</th>
            <th>球類</th>
            <th>教練指定</th>
            <th>健行</th>
            <th>游泳</th>
            <th>其他</th>
            <th>入睡時間</th>
            <th>24點前睡</th>
            <th>備註</th>
        </tr>
    </thead>

    <tbody>

    ${data.map(r => `

        <tr>

            <td>${r.date}</td>

            <td>${r.running}</td>

            <td>${r.weight}</td>

            <td>${r.ball}</td>

            <td>${r.assigned}</td>

            <td>${r.trail}</td>

            <td>${r.yoga}</td>

            <td>${r.other}</td>

            <td class="${r.is_success ? 'success':'fail'}">
                ${r.sleep_raw || '-'}
            </td>

            <td class="${r.is_success ? 'success':'fail'}">
                ${r.is_success ? '✅':'❌'}
            </td>

            <td>${r.remark}</td>

        </tr>

    `).join("")}

    </tbody>
    `;

    container.innerHTML = "";

    container.appendChild(table);
}

function createChart(id, labels, data, color){

    const ctx =
        document.getElementById(id);

    if(!ctx) return;

    if(chartInstances[id]){

        chartInstances[id].destroy();
    }

    chartInstances[id] = new Chart(ctx,{

        type:"bar",

        data:{

            labels,

            datasets:[{

                data,

                backgroundColor:color + "99",

                borderColor:color,

                borderWidth:1
            }]
        },

        plugins:[ChartDataLabels],

        options:{

            responsive:true,

            plugins:{

                legend:{
                    display:false
                },

                datalabels:{

                    color:"#111",

                    anchor:"end",

                    align:"top",

                    font:{
                        weight:"bold"
                    }
                }
            },

            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    });
}

function renderCharts(labels,sums){

    createChart(
        "aerobicChart",
        labels,
        sums.map(x=>x.aerobic),
        "#36b9cc"
    );

    createChart(
        "assignedChart",
        labels,
        sums.map(x=>x.assigned),
        "#f6c23e"
    );

    createChart(
        "strengthChart",
        labels,
        sums.map(x=>x.strength),
        "#4e73df"
    );

    createChart(
        "sleepChart",
        labels,
        sums.map(x=>x.success_count),
        "#1cc88a"
    );
}

function renderAverages(sums){

    const avg = arr =>

        arr.length
        ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1)
        : 0;

    document.getElementById("avgAerobic").innerHTML =
        `平均 ${avg(sums.map(x=>x.aerobic))} 分鐘/月`;

    document.getElementById("avgAssigned").innerHTML =
        `平均 ${avg(sums.map(x=>x.assigned))} 次/月`;

    document.getElementById("avgStrength").innerHTML =
        `平均 ${avg(sums.map(x=>x.strength))} 次/月`;

    document.getElementById("avgSleep").innerHTML =
        `平均 ${avg(sums.map(x=>x.success_count))} 天/月`;
}

function renderSleepSummary(){

    const totalDays =
        allData.filter(x=>x.sleep_raw).length;

    const successDays =
        allData.filter(x=>x.is_success).length;

    const rate =
        totalDays
        ? ((successDays / totalDays) * 100).toFixed(1)
        : 0;

    document.getElementById("sleepSummary").innerHTML =

    `
    🛌 24點前睡覺成功：<b>${successDays}</b> 天
    <br>
    📊 睡眠達標率：<b>${rate}%</b>
    `;
}

</script>

</body>
</html>
```
