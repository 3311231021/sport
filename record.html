<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>健康管理與運動記錄系統</title>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 20px;
      background-color: #fafafa;
      color: #333;
    }
    h1 { text-align: center; margin-bottom: 5px; }
    #todayDate { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; }

    /* 最近紀錄表格 */
    #recentTable { overflow-x: auto; margin-bottom: 25px; }
    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
    th { background-color: #f3f3f3; }

    /* 統計圖區塊 */
    .chart-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      justify-items: center;
      align-items: stretch;
    }
    .chart-box {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }
    .chart-box h3 { font-size: 15px; margin-bottom: 6px; }
    .avg-box { font-size: 13px; margin-top: 4px; color: #555; }

    canvas {
      width: 100% !important;
      aspect-ratio: 4 / 3 !important;
    }

    @media (max-width: 600px) {
      body { margin: 10px; }
      h1 { font-size: 18px; }
      th, td { font-size: 11px; }
    }
  </style>
</head>
<body>
  <h1>🏋️‍♀️ 健康管理與運動記錄系統 (Demo: Nancy)</h1>
  <div id="todayDate"></div>
  
  <h2> 🎯 Target 每週至少運動3次 ＆ 落實12點前自覺關機</h2>
  
  <h2>🗓️ 最近 10 筆健康與運動紀錄</h2>
  <div id="recentTable"></div>

  <div class="chart-container">
    <div class="chart-box">
      <h3>🏃‍♂️ 有氧活動時間 (min)</h3>
      <canvas id="aerobicChart"></canvas>
      <div class="avg-box" id="avgAerobic"></div>
    </div>
    <div class="chart-box">
      <h3>📋 教練指定作業完成次數</h3>
      <canvas id="assignedChart"></canvas>
      <div class="avg-box" id="avgAssigned"></div>
    </div>
    <div class="chart-box">
      <h3>💪 肌力訓練次數</h3>
      <canvas id="strengthChart"></canvas>
      <div class="avg-box" id="avgStrength"></div>
    </div>
    <!-- 🛌 智慧生活防禦 Dashboard -->
    <div class="chart-box">
      <h3>🛌 自覺生活防禦：入睡時間統計 (點)</h3>
      <canvas id="sleepChart"></canvas>
      <div class="avg-box" id="avgSleep"></div>
    </div>
  </div>

  <script>
    // 顯示今天日期
    const todayElement = document.getElementById("todayDate");
    const today = new Date();
    const options = { year: "numeric", month: "long", day: "numeric", weekday: "long" };
    todayElement.textContent = `📅 今天日期：${today.toLocaleDateString("zh-TW", options)}`;

    let allData = [];
    let chartInstances = {};

    // 讀取 CSV
    fetch("sport.csv")
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split("\n");
        const headers = lines.shift().split(",");

        allData = lines.map(line => {
          const values = line.split(",");
          
          // 預設與容錯變數設定
          let sleepRaw = "23:30"; 
          let remarkStr = "";
          
          // 對應 Excel 結構：K欄(Index 10)是入睡時間，L欄(Index 11)是備註
          let kVal = values[10] ? values[10].trim() : "";
          let lVal = values[11] ? values[11].trim() : "";

          // 【智慧型欄位對帳演算法】
          if (kVal.includes(":")) {
            // 情況一：K欄具備標準時間格式 (如 22:45, 23:00) -> 完美對齊
            sleepRaw = kVal;
            remarkStr = lVal;
          } else {
            // 情況二：K欄不是時間，代表舊資料可能因為空白欄位而發生往左平移錯位
            sleepRaw = "23:30"; // 舊資料自動補齊健康的自覺防禦線
            
            // 排除轉換失敗的亂碼，抓取真正的文字備註（如：坐姿、調整姿勢）
            if (kVal !== "" && !kVal.includes("") && !kVal.includes("ψ")) {
              remarkStr = kVal; 
            } else if (lVal !== "" && !lVal.includes("") && !lVal.includes("ψ")) {
              remarkStr = lVal;
            } else {
              // 防護網：若嚴重錯位，由後往前巡檢，把中文字串撈回備註
              remarkStr = "";
              for (let i = 8; i < values.length; i++) {
                if (values[i] && !values[i].includes(":") && isNaN(values[i])) {
                  let temp = values[i].trim();
                  if (!temp.includes("") && !temp.includes("ψ")) {
                    remarkStr = temp;
                    break;
                  }
                }
              }
            }
          }

          // 如果備註為空或仍含有編碼亂碼，一律無痕修復為日常紀錄
          if (remarkStr === "" || remarkStr.includes("") || remarkStr.includes("ψ")) {
            remarkStr = "日常紀錄"; 
          }

          // 計算數值化入睡時間點 (供 Chart.js 計算與變色)
          let sleepHourDecimal = 23.5;
          const parts = sleepRaw.split(":");
          let hr = Number(parts[0]);
          let mn = Number(parts[1] || 0);
          if (hr < 6) hr += 24; // 跨夜凌晨算作 24點之後
          sleepHourDecimal = hr + (mn / 60);

          return {
            date: values[0],
            running: Number(values[1] || 0),
            weight: Number(values[2] || 0),
            ball: Number(values[3] || 0),
            assigned: Number(values[4] || 0),
            trail: Number(values[5] || 0),
            yoga: Number(values[6] || 0),
            other: Number(values[7] || 0),
            speed: values[8] || "",
            heart_rate: values[9] || "",
            sleep_hour: sleepHourDecimal,
            sleep_raw: sleepRaw,
            remark: remarkStr
          };
        });

        allData.sort((a, b) => new Date(a.date) - new Date(b.date));
        renderAll();
      })
      .catch(err => {
        console.error("讀取 CSV 錯誤：", err);
        alert("無法讀取 sport.csv，請確認檔案存在且格式正確。");
      });

    function renderAll() {
      const sorted = [...allData].sort((a, b) => new Date(b.date) - new Date(a.date));
      const recent10 = sorted.slice(0, 10);
      renderRecentTable(recent10);

      const monthly = {};
      allData.forEach(item => {
        if (!item.date) return;
        const ym = item.date.replace(/\//g, '-').slice(0, 7);
        if (!monthly[ym]) monthly[ym] = { running: 0, weight: 0, ball: 0, assigned: 0, trail: 0, yoga: 0, other: 0, sleep_sum: 0, count: 0 };
        monthly[ym].running += item.running;
        monthly[ym].weight += item.weight;
        monthly[ym].ball += item.ball;
        monthly[ym].assigned += item.assigned;
        monthly[ym].trail += item.trail;
        monthly[ym].yoga += item.yoga;
        monthly[ym].other += item.other;
        monthly[ym].sleep_sum += item.sleep_hour;
        monthly[ym].count += 1;
      });

      let labels = Object.keys(monthly).sort();
      let sums = Object.values(monthly).map(d => ({
        aerobic: d.running + d.ball + d.trail,
        assigned: d.assigned,
        strength: d.weight + d.yoga,
        sleep_avg: d.count ? Number((d.sleep_sum / d.count).toFixed(2)) : 23.5
      }));

      if (labels.length > 12) {
        labels = labels.slice(-12);
        sums = sums.slice(-12);
      }

      renderCharts(labels, sums);
      renderAverages(sums);
    }

    function renderRecentTable(data) {
      const container = document.getElementById("recentTable");
      container.innerHTML = "";
      const table = document.createElement("table");
      const thead = `
        <thead><tr>
          <th>日期</th><th>跑步(min)</th><th>肌力訓練</th>
          <th>球類(min)</th><th>教練指定</th>
          <th>健行(min)</th><th>游泳</th><th>其他</th><th>跑速</th><th>心率</th><th>入睡時間</th><th>備註</th>
        </tr></thead>`;
      const tbody = data.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.running}</td>
          <td>${r.weight}</td>
          <td>${r.ball}</td>
          <td>${r.assigned}</td>
          <td>${r.trail}</td>
          <td>${r.yoga}</td>
          <td>${r.other}</td>
          <td>${r.speed}</td>
          <td>${r.heart_rate}</td>
          <td style="font-weight:bold; color: ${r.sleep_hour >= 24 ? '#e74a3b':'#1cc88a'}">${r.sleep_raw}</td>
          <td>${r.remark}</td>
        </tr>
      `).join("");
      table.innerHTML = thead + "<tbody>" + tbody + "</tbody>";
      container.appendChild(table);
    }

    function renderCharts(labels, sums) {
      // 渲染前三個運動圖表
      const datasets = [
        { id: "aerobicChart", label: "有氧活動時間", key: "aerobic", color: "#36b9cc" },
        { id: "assignedChart", label: "教練指定作業", key: "assigned", color: "#f6c23e" },
        { id: "strengthChart", label: "肌力訓練", key: "strength", color: "#4e73df" }
      ];

      datasets.forEach(({ id, label, key, color }) => {
        if (chartInstances[id]) chartInstances[id].destroy();
        const ctx = document.getElementById(id);
        chartInstances[id] = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label,
              data: sums.map(x => x[key]),
              backgroundColor: color + "99",
              borderColor: color,
              borderWidth: 1
            }]
          },
          plugins: [ChartDataLabels],
          options: {
            aspectRatio: 4/3,
            responsive: true,
            scales: { y: { beginAtZero: true } },
            plugins: {
              legend: { display: false },
              datalabels: {
                color: '#111',
                anchor: 'center',
                align: 'center',
                font: { weight: 'bold', size: 12 },
                formatter: value => value
              }
            }
          }
        });
      });

      // 🛌 智慧變色睡眠防禦圖表
      const sleepId = "sleepChart";
      if (chartInstances[sleepId]) chartInstances[sleepId].destroy();
      const sleepCtx = document.getElementById(sleepId);
      
      chartInstances[sleepId] = new Chart(sleepCtx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "平均入睡時間點",
            data: sums.map(x => x.sleep_avg),
            // 行為經濟學機制：超過 24 點（12:00 AM）自動觸變為警告紅，否則為自覺綠
            backgroundColor: sums.map(x => x.sleep_avg >= 24 ? "#e74a3b99" : "#1cc88a99"),
            borderColor: sums.map(x => x.sleep_avg >= 24 ? "#e74a3b" : "#1cc88a"),
            borderWidth: 1
          }]
        },
        plugins: [ChartDataLabels],
        options: {
          aspectRatio: 4/3,
          responsive: true,
          scales: { 
            y: { 
              min: 20, 
              max: 27, 
              title: { display: true, text: "時間 (24小時制)" },
              ticks: {
                callback: function(value) {
                  if(value >= 24) return "凌晨 " + (value - 24) + " 點";
                  return "晚上 " + value + " 點";
                }
              }
            } 
          },
          plugins: {
            legend: { display: false },
            datalabels: {
              color: '#111',
              anchor: 'end',
              align: 'top',
              font: { weight: 'bold', size: 11 },
              formatter: value => {
                let hr = Math.floor(value);
                let mn = Math.round((value - hr) * 60);
                if (hr >= 24) hr -= 24;
                return `${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')}`;
              }
            }
          }
        }
      });
    }

    function renderAverages(sums) {
      const avg = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1) : 0;
      document.getElementById("avgAerobic").innerText = `📊 平均：${avg(sums.map(x => x.aerobic))} 分鐘/月`;
      document.getElementById("avgAssigned").innerText = `📊 平均：${avg(sums.map(x => x.assigned))} 次/月`;
      document.getElementById("avgStrength").innerText = `📊 平均：${avg(sums.map(x => x.strength))} 次/月`;
      
      const rawSleepAvg = sums.length ? sums.reduce((a,b)=>a+b.sleep_avg, 0)/sums.length : 23.5;
      let hr = Math.floor(rawSleepAvg);
      let mn = Math.round((rawSleepAvg - hr) * 60);
      if(hr >= 24) hr -= 24;
      document.getElementById("avgSleep").innerText = `🛌 總體平均入睡時間：${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
