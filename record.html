<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1">

<title>健康管理與運動記錄系統</title>

<meta property="og:title"
content="健康管理與運動記錄系統">

<meta property="og:description"
content="個人健康與運動追蹤 Dashboard">

<meta property="og:type"
content="website">

<meta name="description"
content="健康管理與運動紀錄系統">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Chart DataLabels -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    margin:0;
    padding:16px;
    background:#f5f6fa;
    color:#333;
}

h1{
    text-align:center;
    margin-bottom:8px;
    font-size:clamp(24px,5vw,36px);
}

#todayDate{
    text-align:center;
    color:#666;
    margin-bottom:20px;
    font-size:14px;
}

h2{
    margin-top:28px;
    margin-bottom:14px;
    font-size:clamp(18px,4vw,24px);
    line-height:1.5;
}

/* 卡片 */

.summary-box,
.chart-box{
    background:white;
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* Summary */

.summary-box{
    margin-bottom:24px;
    text-align:center;
    line-height:1.8;
    font-size:16px;
}

/* 表格 */

#recentTable{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin-bottom:30px;
    border-radius:16px;
}

table{
    width:100%;
    min-width:680px;
    border-collapse:collapse;
    background:white;
    overflow:hidden;
}

th,
td{
    border:1px solid #ddd;
    padding:10px 8px;
    text-align:center;
    font-size:13px;
    white-space:nowrap;
}

th{
    background:#f1f1f1;
    position:sticky;
    top:0;
    z-index:2;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

tbody tr:hover{
    background:#f0f7ff;
}

/* 圖表 */

.chart-container{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.chart-box h3{
    text-align:center;
    margin-bottom:14px;
    font-size:18px;
}

.avg-box{
    text-align:center;
    margin-top:10px;
    color:#666;
    font-size:14px;
}

/* Chart */

canvas{
    width:100% !important;
    height:auto !important;
    max-height:320px;
}

/* 狀態 */

.success{
    color:#1cc88a;
    font-weight:bold;
}

.fail{
    color:#e74a3b;
    font-weight:bold;
}

/* 平板 */

@media(max-width:992px){

    body{
        padding:14px;
    }

    .chart-container{
        grid-template-columns:1fr;
    }

    table{
        min-width:640px;
    }
}

/* 手機 */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .summary-box,
    .chart-box{
        padding:14px;
        border-radius:14px;
    }

    th,
    td{
        font-size:12px;
        padding:8px 6px;
    }

    table{
        min-width:620px;
    }

    .chart-box h3{
        font-size:16px;
    }

    .avg-box{
        font-size:13px;
    }

    canvas{
        max-height:260px;
    }
}

/* 超小手機 */

@media(max-width:400px){

    table{
        min-width:580px;
    }

    th,
    td{
        font-size:11px;
    }

    .summary-box{
        font-size:14px;
    }
}

</style>

</head>

<body>

<h1>🏋️‍♀️ 健康管理與運動記錄 (Statistics tracked since July 1, 2025) </h1>

<div id="todayDate"></div>

<h2>
🎯 Target 每週至少運動3次 ＆ 每日24點前睡覺
</h2>

<div class="summary-box" id="sleepSummary"></div>

<h2>🗓️ 最近 10 筆健康與運動紀錄(簡化顯示) </h2>

<div id="recentTable"></div>

<div class="chart-container">

    <div class="chart-box">
        <h3>🏃‍♂️ 每月有氧活動時間</h3>
        <canvas id="aerobicChart"></canvas>
        <div class="avg-box" id="avgAerobic"></div>
    </div>

    <div class="chart-box">
        <h3>📋 每月教練指定作業</h3>
        <canvas id="assignedChart"></canvas>
        <div class="avg-box" id="avgAssigned"></div>
    </div>

    <div class="chart-box">
        <h3>💪 每月肌力訓練</h3>
        <canvas id="strengthChart"></canvas>
        <div class="avg-box" id="avgStrength"></div>
    </div>

    <div class="chart-box">
        <h3>🛌 每月24點前睡覺次數</h3>
        <canvas id="sleepChart"></canvas>
        <div class="avg-box" id="avgSleep"></div>
    </div>

</div>

<script>

const today = new Date();

document.getElementById("todayDate").innerHTML =
`📅 今天日期：${today.toLocaleDateString("zh-TW")}`;

let allData = [];

let chartInstances = {};

function toNum(v){

    const n = Number(v);

    return isNaN(n) ? 0 : n;
}

function parseCSVLine(line){

    const result = [];

    let current = "";

    let inQuotes = false;

    for(let i=0;i<line.length;i++){

        const char = line[i];

        if(char === '"'){

            inQuotes = !inQuotes;

        }else if(char === ',' && !inQuotes){

            result.push(current);

            current = "";

        }else{

            current += char;
        }
    }

    result.push(current);

    return result;
}

function normalizeSleepHour(timeStr){

    if(!timeStr.includes(":")) return null;

    const [h,m] =
        timeStr.split(":").map(Number);

    let hour = h + (m / 60);

    if(hour < 6){
        hour += 24;
    }

    return hour;
}

fetch("sport.csv")

.then(res => res.text())

.then(text => {

    localStorage.setItem("sportData",text);

    processCSV(text);

})

.catch(err => {

    console.error("CSV讀取失敗:",err);

    const cache =
        localStorage.getItem("sportData");

    if(cache){

        processCSV(cache);

    }else{

        alert("CSV讀取失敗");
    }
});

function processCSV(text){

    const lines =
        text.trim().split("\n");

    const headers =
        parseCSVLine(lines.shift());

    allData = lines.map(line => {

        const values =
            parseCSVLine(line);

        const row = {};

        headers.forEach((h,i)=>{

            row[h.trim()] =
                values[i]
                ? values[i].trim()
                : "";
        });

        const sleepRaw =
            row.sleep || "";

        const sleepHour =
            normalizeSleepHour(sleepRaw);

        const isSuccess =
            sleepHour !== null &&
            sleepHour < 24;

        return {

            date: row.date,

            running: toNum(row.running),

            weight: toNum(row.weight),

            ball: toNum(row.ball),

            assigned: toNum(row.assigned),

            trail: toNum(row.trail),

            yoga: toNum(row.yoga),

            other: toNum(row.other),

            heart_rate: toNum(row.heart_rate),

            speed: row.speed,

            sleep_raw: sleepRaw,

            sleep_hour: sleepHour,

            is_success: isSuccess,

            remark:
                row.remark || "日常紀錄"
        };

    }).filter(x => x.date);

    allData.sort((a,b)=>

        new Date(a.date.replace(/\//g,"-")) -
        new Date(b.date.replace(/\//g,"-"))
    );

    renderAll();
}

function renderAll(){

    const sorted = [...allData].sort((a,b)=>

        new Date(b.date.replace(/\//g,"-")) -
        new Date(a.date.replace(/\//g,"-"))
    );

    renderRecentTable(sorted.slice(0,10));

    const monthly = {};

    allData.forEach(item => {

        const ym =
            item.date.replace(/\//g,"-")
            .slice(0,7);

        if(!monthly[ym]){

            monthly[ym] = {

                aerobic:0,

                assigned:0,

                strength:0,

                success_count:0
            };
        }

        monthly[ym].aerobic +=
            item.running +
            item.ball +
            item.trail;

        monthly[ym].assigned +=
            item.assigned;

        monthly[ym].strength +=
            item.weight;

        if(item.is_success){

            monthly[ym].success_count += 1;
        }
    });

    const labels =
        Object.keys(monthly).sort();

    const sums =
        Object.values(monthly);

    renderCharts(labels,sums);

    renderAverages(sums);

    renderSleepSummary();
}

function renderRecentTable(data){

    const container =
        document.getElementById("recentTable");

    const table =
        document.createElement("table");

    table.innerHTML = `

    <thead>
        <tr>
            <th>日期</th>
            <th>跑步</th>
            <th>肌力</th>
            <th>教練指定</th>
            <th>其他</th>
            <th>速率 Treadmill Dashboard </th>
            <th>心率 Apple Watch </th>
            <th>入睡時間</th>
            <th>24點前睡</th>
            <th>備註</th>
        </tr>
    </thead>

    <tbody>

    ${data.map(r => `

        <tr>

            <td>${r.date}</td>

            <td>${r.running}</td>

            <td>${r.weight}</td>

            <td>${r.assigned}</td>

            <td>${r.other}</td>

            <td>
                ${r.speed ? r.speed + '/km' : '-'}
            </td>

            <td>
                ${r.heart_rate
                    ? r.heart_rate + ' bpm'
                    : '-'}
            </td>

            <td class="${r.is_success ? 'success':'fail'}">
                ${r.sleep_raw || '-'}
            </td>

            <td class="${r.is_success ? 'success':'fail'}">
                ${r.is_success ? '✅':'❌'}
            </td>

            <td>${r.remark}</td>

        </tr>

    `).join("")}

    </tbody>
    `;

    container.innerHTML = "";

    container.appendChild(table);
}

function createChart(id, labels, data, color){

    const ctx =
        document.getElementById(id);

    if(!ctx) return;

    if(chartInstances[id]){

        chartInstances[id].destroy();
    }

    chartInstances[id] = new Chart(ctx,{

        type:"bar",

        data:{

            labels,

            datasets:[{

                data,

                backgroundColor:color + "99",

                borderColor:color,

                borderWidth:1,

                borderRadius:8
            }]
        },

        plugins:[ChartDataLabels],

        options:{

            responsive:true,

            maintainAspectRatio:false,

            interaction:{
                mode:'index',
                intersect:false
            },

            plugins:{

                legend:{
                    display:false
                },

                tooltip:{
                    enabled:true
                },

                datalabels:{

                    color:"#111",

                    anchor:"end",

                    align:"top",

                    font:{
                        weight:"bold"
                    }
                }
            },

            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    });
}

function renderCharts(labels,sums){

    createChart(
        "aerobicChart",
        labels,
        sums.map(x=>x.aerobic),
        "#36b9cc"
    );

    createChart(
        "assignedChart",
        labels,
        sums.map(x=>x.assigned),
        "#f6c23e"
    );

    createChart(
        "strengthChart",
        labels,
        sums.map(x=>x.strength),
        "#4e73df"
    );

    createChart(
        "sleepChart",
        labels,
        sums.map(x=>x.success_count),
        "#1cc88a"
    );
}

function renderAverages(sums){

    const avg = arr =>

        arr.length
        ? (
            arr.reduce((a,b)=>a+b,0)
            / arr.length
        ).toFixed(1)
        : 0;

    document.getElementById("avgAerobic").innerHTML =
        `平均 ${avg(sums.map(x=>x.aerobic))} 分鐘/月`;

    document.getElementById("avgAssigned").innerHTML =
        `平均 ${avg(sums.map(x=>x.assigned))} 次/月`;

    document.getElementById("avgStrength").innerHTML =
        `平均 ${avg(sums.map(x=>x.strength))} 次/月`;

    document.getElementById("avgSleep").innerHTML =
        `平均 ${avg(sums.map(x=>x.success_count))} 天/月`;
}

function renderSleepSummary(){

    const totalDays =
        allData.filter(x=>x.sleep_raw).length;

    const successDays =
        allData.filter(x=>x.is_success).length;

    const rate =
        totalDays
        ? (
            (successDays / totalDays) * 100
        ).toFixed(1)
        : 0;

    document.getElementById("sleepSummary").innerHTML =

    `
    <div style="
        display:grid;
        grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
        gap:16px;
    ">

        <div style="
            background:#f8f9fc;
            border-radius:14px;
            padding:18px;
        ">
            <div style="
                font-size:32px;
                font-weight:bold;
                color:#1cc88a;
            ">
                ${successDays}
            </div>

            <div>
                🛌 達標天數
            </div>
        </div>

        <div style="
            background:#f8f9fc;
            border-radius:14px;
            padding:18px;
        ">
            <div style="
                font-size:32px;
                font-weight:bold;
                color:#4e73df;
            ">
                ${rate}%
            </div>

            <div>
                📊 睡眠達標率
            </div>
        </div>

    </div>
    `;
}

</script>

</body>
</html>
