<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>行動運動系統</title>

<!-- Leaflet 地圖（通訊：OpenStreetMap） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 10px;
  background: #f5f5f5;
}
#map {
  height: 300px;
  margin-bottom: 12px;
  border-radius: 10px;
}
.card {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  box-shadow: 0 0 6px rgba(0,0,0,.2);
}
button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #007bff;
  color: white;
}
</style>
</head>

<body>

<h2>📱 行動運動紀錄系統</h2>

<div id="map"></div>

<div class="card">
  <p>📍 位置：<span id="pos"> 定位 ing </span></p>
  <p>🛰️ GPS 精度：<span id="acc">--</span> m</p>
  <p>🛣️ 移動距離：<span id="dist">0</span> 公尺</p>
  <p>👣 步數：<span id="steps">0</span></p>
</div>

<button id="btnStart">開始運動</button>

<script>
/* =========================================================
   1. 地圖顯示（通訊）
   ========================================================= */

const INIT_LAT = 24.136873;
const INIT_LNG = 120.685017;

const map = L.map("map").setView([INIT_LAT, INIT_LNG], 16);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap"
}).addTo(map);

let marker = L.marker([INIT_LAT, INIT_LNG]).addTo(map);
let polyline = null;

/* =========================================================
   2. GPS 定位（行動 + 通訊）
   ========================================================= */

let path = [];
let totalDistance = 0;
let firstFix = true;
let gpsWatchId = null;

function startGPS() {

  // 避免重複啟動 GPS
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
  }

  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      const age = Date.now() - pos.timestamp;

      if (age > 5000) return;                 // 過濾 5 秒前的舊資料
      if (!firstFix && accuracy > 25) return; // 過濾低精度

      document.getElementById("pos").innerText =
        latitude.toFixed(6) + ", " + longitude.toFixed(6);
      document.getElementById("acc").innerText =
        accuracy.toFixed(1);

      // 初始定位
      if (firstFix) {
        map.setView([latitude, longitude], 18);
        marker.setLatLng([latitude, longitude]);
        path = [[latitude, longitude]];
        firstFix = false;
        return;
      }

      marker.setLatLng([latitude, longitude]);
      path.push([latitude, longitude]);

      // 更新移動路徑
      if (!polyline) {
        polyline = L.polyline(path, { weight: 5 }).addTo(map);
      } else {
        polyline.setLatLngs(path);
      }

      // 距離計算
      const p1 = path[path.length - 2];
      const p2 = path[path.length - 1];
      const d = calcDistance(p1, p2);

      if (d < 1.5) return; // 忽略小於 1.5 公尺的移動

      totalDistance += d;
      document.getElementById("dist").innerText =
        totalDistance.toFixed(1);
    },
    err => {
      if (err.code === 1) {
        alert("定位權限被拒絕，請到瀏覽器設定中允許位置存取");
      } else if (err.code === 2) {
        alert("無法取得定位資訊，請到戶外再試");
      } else if (err.code === 3) {
        alert("GPS 逾時，請稍候再試");
      } else {
        alert("GPS 錯誤：" + err.message);
      }
    },
    { enableHighAccuracy: true, timeout: 20000 }
  );
}

/* =========================================================
   3. 距離計算（Haversine）
   ========================================================= */

function calcDistance(a, b) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;

  const dLat = toRad(b[0] - a[0]);
  const dLng = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]);
  const lat2 = toRad(b[0]);

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLng / 2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

/* =========================================================
   4. 計步器（行動：加速度感測器）
   ========================================================= */

let steps = 0;
let lastPeak = 0;

function startPedometer() {
  if (typeof DeviceMotionEvent?.requestPermission === "function") {
    DeviceMotionEvent.requestPermission().then(res => {
      if (res === "granted") {
        window.addEventListener("devicemotion", onMotion);
      }
    });
  } else {
    window.addEventListener("devicemotion", onMotion);
  }
}

function onMotion(e) {
  const acc = e.acceleration || e.accelerationIncludingGravity;
  if (!acc) return;

  const total =
    Math.abs(acc.x || 0) +
    Math.abs(acc.y || 0) +
    Math.abs(acc.z || 0);

  const now = Date.now();
  if (total > 22 && now - lastPeak > 400) {
    steps++;
    document.getElementById("steps").innerText = steps;
    lastPeak = now;
  }
}

/* =========================================================
   5. 系統流程：開始運動
   ========================================================= */

document.getElementById("btnStart").onclick = () => {
  steps = 0;
  totalDistance = 0;
  path = [];
  firstFix = true;

  if (polyline) {
    map.removeLayer(polyline);
    polyline = null;
  }

  document.getElementById("steps").innerText = "0";
  document.getElementById("dist").innerText = "0";

  startGPS();
  startPedometer();

  alert("已啟動 GPS 與計步功能");
};
</script>

</body>
</html>
